version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-slack-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
